<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>005 · Dad Joke Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #F5F0E8;
    --ink: #1A1208;
    --brown: #5C3D1E;
    --amber: #C8860A;
    --rule: #8B6340;
    --paper: #EDE8D8;
  }

  body {
    min-height: 100vh;
    background: var(--cream);
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(139,99,64,0.08) 28px);
    font-family: 'Courier Prime', monospace;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 1rem 2rem;
  }

  .portfolio-bar {
    width: 100%;
    max-width: 680px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--rule);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--brown);
    margin-bottom: 2rem;
  }

  .portfolio-bar a {
    color: var(--amber);
    text-decoration: none;
    font-weight: 700;
  }

  .portfolio-bar a:hover { text-decoration: underline; }

  .masthead {
    width: 100%;
    max-width: 680px;
    text-align: center;
    border-top: 4px double var(--rule);
    border-bottom: 4px double var(--rule);
    padding: 1rem 0;
    margin-bottom: 0.5rem;
  }

  .dateline {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--brown);
    margin-bottom: 0.4rem;
  }

  .masthead h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.8rem, 8vw, 4.5rem);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--ink);
  }

  .masthead .tagline {
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--brown);
    margin-top: 0.4rem;
  }

  .rule-thick {
    width: 100%;
    max-width: 680px;
    border: none;
    border-top: 2px solid var(--ink);
    margin: 0.4rem 0;
  }

  .main-card {
    width: 100%;
    max-width: 680px;
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 2.5rem 2rem;
    margin-top: 1.2rem;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .main-card::before {
    content: '❝';
    position: absolute;
    top: 0.6rem;
    left: 1.2rem;
    font-size: 3rem;
    color: var(--rule);
    line-height: 1;
    font-family: 'Playfair Display', serif;
  }

  .joke-setup {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.2rem, 3.5vw, 1.7rem);
    font-style: italic;
    text-align: center;
    color: var(--ink);
    line-height: 1.45;
    margin-bottom: 1.2rem;
    min-height: 2.5em;
    transition: opacity 0.3s;
  }

  .joke-punchline {
    font-family: 'Courier Prime', monospace;
    font-weight: 700;
    font-size: clamp(1rem, 3vw, 1.3rem);
    text-align: center;
    color: var(--brown);
    letter-spacing: 0.02em;
    min-height: 1.5em;
    transition: opacity 0.3s;
    border-top: 1px dashed var(--rule);
    padding-top: 1rem;
    width: 100%;
  }

  .joke-punchline.hidden-punch {
    opacity: 0;
    pointer-events: none;
  }

  .reveal-btn {
    background: none;
    border: 1px solid var(--rule);
    color: var(--brown);
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 6px 18px;
    cursor: pointer;
    margin-top: 0.8rem;
    transition: background 0.15s, color 0.15s;
  }

  .reveal-btn:hover { background: var(--amber); color: var(--cream); border-color: var(--amber); }

  .placeholder-text {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.2rem;
    color: var(--rule);
    text-align: center;
  }

  .loading-text {
    font-family: 'Courier Prime', monospace;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--brown);
    text-align: center;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .btn-row {
    width: 100%;
    max-width: 680px;
    display: flex;
    gap: 12px;
    margin-top: 1.2rem;
    justify-content: center;
  }

  .main-btn {
    background: var(--ink);
    color: var(--cream);
    border: 2px solid var(--ink);
    font-family: 'Courier Prime', monospace;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 14px 32px;
    cursor: pointer;
    flex: 1;
    max-width: 280px;
    transition: background 0.15s, color 0.15s;
  }

  .main-btn:hover { background: var(--amber); border-color: var(--amber); }
  .main-btn:active { transform: scale(0.98); }
  .main-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .groan-meter {
    width: 100%;
    max-width: 680px;
    margin-top: 1.5rem;
    border-top: 1px solid var(--rule);
    padding-top: 1rem;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--brown);
  }

  .groan-bar-wrap {
    flex: 1;
    height: 8px;
    background: var(--cream);
    border: 1px solid var(--rule);
  }

  .groan-bar-fill {
    height: 100%;
    background: var(--amber);
    transition: width 0.6s ease;
    width: 0%;
  }

  .groan-label { min-width: 80px; text-align: right; }

  .count-display {
    width: 100%;
    max-width: 680px;
    text-align: center;
    font-size: 11px;
    color: var(--brown);
    letter-spacing: 0.1em;
    margin-top: 0.6rem;
  }

  .error-msg {
    font-family: 'Courier Prime', monospace;
    font-size: 12px;
    color: #8B3D1E;
    text-align: center;
    padding: 1rem;
  }

  .api-row {
    width: 100%;
    max-width: 680px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 1.2rem;
    border: 1px solid var(--rule);
    padding: 10px 14px;
    background: var(--paper);
  }

  .api-row label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--brown);
    white-space: nowrap;
  }

  .api-row input {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rule);
    font-family: 'Courier Prime', monospace;
    font-size: 13px;
    color: var(--ink);
    padding: 4px 0;
    outline: none;
  }

  .api-row input::placeholder { color: var(--rule); }
</style>
</head>
<body>

<div class="portfolio-bar">
  <span>App #005</span>
  <a href="../index.html">← AppADay Portfolio</a>
  <span>appaday</span>
</div>

<div class="masthead">
  <div class="dateline">The Daily Groan · Est. 2026</div>
  <h1>Dad Joke Generator</h1>
  <div class="tagline">All the groans. None of the regrets.</div>
</div>

<hr class="rule-thick">

<div class="api-row">
  <label for="apiKey">API Key</label>
  <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off">
</div>

<div class="main-card" id="jokeCard">
  <p class="placeholder-text" id="placeholder">Press the button below.<br>You have been warned.</p>
  <div class="joke-setup" id="jokeSetup" style="display:none;"></div>
  <div class="joke-punchline hidden-punch" id="jokePunchline"></div>
  <button class="reveal-btn" id="revealBtn" style="display:none;" onclick="revealPunchline()">Reveal punchline</button>
  <p class="loading-text" id="loadingText" style="display:none;">Consulting Dad...</p>
  <p class="error-msg" id="errorMsg" style="display:none;"></p>
</div>

<div class="btn-row">
  <button class="main-btn" id="jokeBtn" onclick="getJoke()">Tell Me A Joke</button>
</div>

<div class="groan-meter">
  <span>Groan level</span>
  <div class="groan-bar-wrap"><div class="groan-bar-fill" id="groanFill"></div></div>
  <span class="groan-label" id="groanLabel">—</span>
</div>

<div class="count-display" id="countDisplay"></div>

<script>
let jokeCount = 0;
let currentPunchline = '';
let punchlineVisible = false;

async function getJoke() {
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) {
    alert('Paste your Anthropic API key first.');
    return;
  }

  const btn = document.getElementById('jokeBtn');
  const placeholder = document.getElementById('placeholder');
  const setup = document.getElementById('jokeSetup');
  const punchline = document.getElementById('jokePunchline');
  const revealBtn = document.getElementById('revealBtn');
  const loading = document.getElementById('loadingText');
  const errorMsg = document.getElementById('errorMsg');
  const groanFill = document.getElementById('groanFill');
  const groanLabel = document.getElementById('groanLabel');

  btn.disabled = true;
  placeholder.style.display = 'none';
  setup.style.display = 'none';
  punchline.classList.add('hidden-punch');
  punchline.style.display = 'none';
  revealBtn.style.display = 'none';
  errorMsg.style.display = 'none';
  loading.style.display = 'block';
  groanFill.style.width = '0%';
  groanLabel.textContent = '—';
  punchlineVisible = false;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: `Generate a single original dad joke. Respond ONLY with a JSON object and nothing else — no markdown, no backticks, no explanation. The JSON must have exactly these fields:
{
  "setup": "the setup line ending with a question mark or lead-in",
  "punchline": "the punchline",
  "groan_score": a number from 1 to 100 representing how groan-worthy the joke is (100 = maximum groan)
}
Make the joke genuinely dad-joke style: a pun, wordplay, or innocent misdirection. Keep it clean and wholesome.`
        }]
      })
    });

    const data = await response.json();
    const raw = data.content.map(b => b.text || '').join('').replace(/```json|```/g, '').trim();
    const joke = JSON.parse(raw);

    loading.style.display = 'none';
    setup.textContent = joke.setup;
    setup.style.display = 'block';
    currentPunchline = joke.punchline;

    punchline.textContent = joke.punchline;
    punchline.style.display = 'block';
    punchline.classList.add('hidden-punch');
    revealBtn.style.display = 'inline-block';

    const score = Math.min(100, Math.max(1, Math.round(joke.groan_score)));
    groanFill.style.width = score + '%';
    groanLabel.textContent = score + ' / 100';

    jokeCount++;
    document.getElementById('countDisplay').textContent =
      `Jokes endured this session: ${jokeCount}`;

    btn.textContent = 'Another One (Please No)';

  } catch (err) {
    loading.style.display = 'none';
    errorMsg.textContent = 'Dad stepped out. Try again in a moment.';
    errorMsg.style.display = 'block';
    placeholder.style.display = 'block';
    console.error(err);
  }

  btn.disabled = false;
}

function revealPunchline() {
  const punchline = document.getElementById('jokePunchline');
  const revealBtn = document.getElementById('revealBtn');
  punchline.classList.remove('hidden-punch');
  revealBtn.style.display = 'none';
}
</script>

</body>
</html>
